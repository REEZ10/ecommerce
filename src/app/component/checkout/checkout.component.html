<div class="checkout-wrapper">
    <h2 class="checkout-title">Checkout</h2>

    <form class="checkout-form">
        <mat-form-field appearance="outline" class="full-width">
            <mat-label>Delivery Address</mat-label>
            <textarea matInput placeholder="Enter your full address"></textarea>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
            <mat-label>Select Bank</mat-label>
            <mat-select>
                <mat-option value="maybank">Maybank</mat-option>
                <mat-option value="bankislam">Bank Islam</mat-option>
                <mat-option value="bsn">BSN</mat-option>
                <mat-option value="cimb">CIMB</mat-option>
            </mat-select>
        </mat-form-field>

        <button mat-raised-button color="primary" class="pay-btn">
            Confirm Payment
        </button>
    </form>
</div>
